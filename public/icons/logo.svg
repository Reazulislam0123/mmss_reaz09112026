<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#090D16" />
    </linearGradient>

    <!-- Golden Brand Gradient -->
    <linearGradient id="goldGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="35%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Emerald Financial Accent -->
    <linearGradient id="emeraldGrad" x1="128" y1="256" x2="384" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" floodColor="#000000" floodOpacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />

  <!-- Inner Soft Radial Glow -->
  <circle cx="160" cy="140" r="180" fill="#F59E0B" opacity="0.15" filter="url(#glow)" />

  <!-- Architectural Mess House Roof Apex -->
  <path d="M256 96L416 224H352V384C352 401.673 337.673 416 320 416H192C174.327 416 160 401.673 160 384V224H96L256 96Z" fill="url(#goldGrad)" fill-opacity="0.1" stroke="url(#goldGrad)" stroke-width="24" stroke-linejoin="round" />

  <!-- Stylized "M" Structure + Dining Pillars -->
  <!-- Left Pillar -->
  <path d="M208 240V352" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Right Pillar -->
  <path d="M304 240V352" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Center V-Dip -->
  <path d="M208 248L256 304L304 248" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Golden Financial Coin / Meal Cloche Circle -->
  <circle cx="256" cy="208" r="24" fill="url(#goldGrad)" />

  <!-- Base Emerald Safety Foundation -->
  <rect x="176" y="376" width="160" height="20" rx="10" fill="url(#emeraldGrad)" />
</svg>

